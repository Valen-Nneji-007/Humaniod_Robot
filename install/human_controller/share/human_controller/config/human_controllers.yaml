controller_manager:
  ros__parameters:

    update_rate: 100 
    joint_state_broadcaster: 
      type: joint_state_broadcaster/JointStateBroadcaster

    body_controller:
      type: "joint_trajectory_controller/JointTrajectoryController"

body_controller:
  ros__parameters:
    joints:
      - joint_shoulderR
      - joint_elbowR
      - joint_shoulderL
      - joint_elbowL
      - joint_neck
      - joint_waistR
      - joint_kneeR
      - joint_waistL
      - joint_kneeL

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      